name: festy_mobile
description: "Festy - Aplicación móvil de calendario de cumpleaños y galería colaborativa offline-first"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Base de Datos Local Reactiva (Offline-First)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Almacenamiento seguro de tokens JWT
  flutter_secure_storage: ^9.2.2

  # Red & Sincronización
  http: ^1.2.2
  connectivity_plus: ^6.0.4

  # Imágenes & Caché local de Cloudinary
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # Notificaciones Push
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2

  # Utilidades de fecha & UI
  intl: ^0.19.0
  table_calendar: ^3.1.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
